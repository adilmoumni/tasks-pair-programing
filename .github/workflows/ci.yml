  required:
    name: Required
    if: ${{ always() }}
    needs:
      - backend-tests
      - frontend-tests
      # - e2e-tests
      # - docker-security
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          # E2E_RESULT: ${{ needs.e2e-tests.result }}
          # DOCKER_RESULT: ${{ needs.docker-security.result }}
        run: |
          python - <<'PY'
          import os

          results = {
              "backend": os.environ["BACKEND_RESULT"],
              "frontend": os.environ["FRONTEND_RESULT"]
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not pass: {failed}")
          print("All required CI jobs passed.")
          PY
